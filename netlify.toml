# ── CONFIGURACIÓN NETLIFY (Next.js static export) ────────────────
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# ── CABECERAS DE SEGURIDAD ────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Cache-Control          = "public, max-age=3600"

# Las fotos se cachean por más tiempo al ser activos estáticos
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# ── REDIRECCIONES ─────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
